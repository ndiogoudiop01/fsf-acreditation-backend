name: fsf-accreditation

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fsf
      POSTGRES_PASSWORD: fsf
      POSTGRES_DB: fsf_accreditation
    # 5433 hote -> 5432 conteneur : le port 5432 par defaut est deja pris sur
    # de nombreux postes de developpement par une instance PostgreSQL native.
    ports: ['5433:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fsf -d fsf_accreditation']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports: ['6379:6379']
    volumes: [redisdata:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ['9000:9000', '9001:9001']
    volumes: [miniodata:/data]
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports: ['1025:1025', '8025:8025']

  api:
    build: { context: ., dockerfile: docker/Dockerfile }
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://fsf:fsf@postgres:5432/fsf_accreditation?schema=public
      REDIS_URL: redis://redis:6379
      STORAGE_ENDPOINT: http://minio:9000
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    ports: ['3000:3000']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  miniodata:
