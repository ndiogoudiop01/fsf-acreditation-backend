name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fsf
          POSTGRES_PASSWORD: fsf
          POSTGRES_DB: fsf_accreditation
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fsf -d fsf_accreditation"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://fsf:fsf@localhost:5432/fsf_accreditation?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-not-for-production
      JWT_REFRESH_SECRET: ci-refresh-secret-not-for-production
      QR_TOKEN_SECRET: ci-qr-token-secret-not-for-production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --legacy-peer-deps

      - run: npx prisma generate

      - run: npx prisma migrate deploy

      - run: npm run lint

      - run: npm run arch:check

      - run: npm test

      - run: npm run build

      - name: Audit de securite (non bloquant)
        run: npm audit --omit=dev --audit-level=high || true
